name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The hygiene tests scan tracked files; full history is not needed.
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        # Offline: PayPal and Gemini are faked. No secrets are available or needed.
        env:
          PAYPAL_ENV: sandbox
        run: pytest -q
