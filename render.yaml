# Render Blueprint for the hosted demo: one free web service with SQLite on local disk.
# The free tier sleeps after 15 minutes idle and its disk is wiped on restart, so the audit
# log and approvals reset then; orders and the default policy ship in the repo.
# Approvals older than 24 hours are expired in code, so no cron job is needed.
# Secrets are entered in the Render dashboard (sync: false), never committed.

services:
  - type: web
    name: cleat
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.6-flash
      # Each run makes about 5 Gemini calls: 40 runs a day is about 200 requests. Keep
      # AGENT_RUNS_PER_DAY x 5 below the model's requests-per-day quota.
      - key: AGENT_RUNS_PER_HOUR
        value: "10"
      - key: AGENT_RUNS_PER_DAY
        value: "40"
